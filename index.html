<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#090b12">
  <meta name="description" content="CINEMORA — premium cinematic movie and series discovery demo.">
  <title>CINEMORA — Discover Your Next Story</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="ambient ambient-a"></div>
  <div class="ambient ambient-b"></div>
  <div class="noise"></div>

  <header class="site-header" id="siteHeader">
    <a class="brand" href="#" data-nav="home" aria-label="CINEMORA home">
      <span class="brand-mark">C</span><span>CINEMORA</span>
    </a>
    <nav class="desktop-nav" aria-label="Main navigation">
      <button class="nav-link active" data-nav="home">Home</button>
      <button class="nav-link" data-nav="movies">Movies</button>
      <button class="nav-link" data-nav="series">Series</button>
      <button class="nav-link" data-nav="genres">Genres</button>
      <button class="nav-link" data-nav="trending">Trending</button>
    </nav>
    <div class="header-actions">
      <button class="icon-btn" id="searchToggle" aria-label="Open search">⌕</button>
      <button class="icon-btn" id="watchlistBtn" aria-label="Open watchlist">♡<span class="count-badge" id="watchlistCount">0</span></button>
      <button class="avatar-btn" id="profileBtn" aria-label="Open profile">A</button>
      <button class="icon-btn mobile-only" id="menuToggle" aria-label="Open menu">☰</button>
    </div>
  </header>

  <div class="mobile-menu glass-panel" id="mobileMenu">
    <button data-nav="home">Home</button><button data-nav="movies">Movies</button>
    <button data-nav="series">Series</button><button data-nav="genres">Genres</button>
    <button data-nav="trending">Trending</button><button id="mobileWatchlist">Watchlist</button>
  </div>

  <main id="app">
    <section class="hero" id="hero"></section>

    <section class="search-area" id="searchArea" aria-label="Search">
      <div class="search-box glass-panel">
        <span>⌕</span>
        <input id="searchInput" type="search" autocomplete="off" placeholder="Search movies, series, genres or years...">
        <button id="clearSearch" class="clear-search" aria-label="Clear search">×</button>
      </div>
      <div id="suggestions" class="suggestions glass-panel hidden"></div>
    </section>

    <section class="content-shell" id="contentShell">
      <div class="section-heading">
        <div><p class="eyebrow">CURATED FOR YOU</p><h2 id="pageTitle">Trending Now</h2></div>
        <button class="ghost-btn" id="surpriseBtn">🎲 Surprise Me</button>
      </div>
      <div class="filter-row" id="filterRow"></div>
      <div class="sort-row hidden" id="sortRow">
        <label for="sortSelect">Sort</label>
        <select id="sortSelect">
          <option value="popularity">Popularity</option><option value="rating">Rating</option>
          <option value="newest">Newest</option><option value="oldest">Oldest</option><option value="az">A-Z</option>
        </select>
      </div>
      <div id="sections"></div>
    </section>
  </main>

  <footer class="footer">
    <div><span class="brand-small">CINEMORA</span><p>Premium discovery for stories worth watching.</p></div>
    <div class="footer-note">Demo interface • Uses sample/public imagery • No copyrighted video files</div>
  </footer>

  <div class="modal-backdrop hidden" id="modalBackdrop">
    <section class="modal glass-panel" id="modal" role="dialog" aria-modal="true" aria-label="Title details">
      <button class="modal-close" id="modalClose" aria-label="Close">×</button>
      <div id="modalContent"></div>
    </section>
  </div>

  <aside class="drawer glass-panel" id="drawer">
    <button class="modal-close" id="drawerClose" aria-label="Close">×</button>
    <div id="drawerContent"></div>
  </aside>

  <div class="toast-stack" id="toastStack"></div>
  <button class="back-top" id="backTop" aria-label="Back to top">↑</button>

  <script src="js/script.js"></script>
</body>
</html>
