<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chomu hai kya laude</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
overflow:hidden;
background:linear-gradient(135deg,#130019,#25003d,#4b0082,#7b2cbf,#a855f7);
background-size:400% 400%;
animation:bgMove 12s ease infinite;
}

@keyframes bgMove{
0%{background-position:0% 50%;}
50%{background-position:100% 50%;}
100%{background-position:0% 50%;}
}

body::before{
content:"";
position:absolute;
width:600px;
height:600px;
background:#b84dff;
filter:blur(180px);
opacity:.25;
top:-150px;
left:-150px;
}

body::after{
content:"";
position:absolute;
width:500px;
height:500px;
background:#ff4df8;
filter:blur(180px);
opacity:.20;
bottom:-150px;
right:-150px;
}

.container{
position:relative;
z-index:10;
width:90%;
max-width:850px;
text-align:center;
padding:40px;
background:rgba(255,255,255,.08);
backdrop-filter:blur(18px);
border:1px solid rgba(255,255,255,.15);
border-radius:30px;
box-shadow:0 20px 60px rgba(0,0,0,.45);
}

.logo{
font-size:60px;
font-weight:700;
color:white;
letter-spacing:2px;
}

.logo span{
color:#ff5cf7;
}

.tagline{
margin-top:10px;
margin-bottom:35px;
color:#e5d9ff;
font-size:18px;
}

.search-box{
display:flex;
align-items:center;
background:rgba(255,255,255,.10);
border:1px solid rgba(255,255,255,.15);
border-radius:60px;
overflow:hidden;
}

.search-box input{
flex:1;
padding:20px;
font-size:18px;
background:transparent;
border:none;
outline:none;
color:white;
}

.search-box input::placeholder{
color:#ddd;
}

.search-box button{
width:170px;
border:none;
cursor:pointer;
background:linear-gradient(135deg,#d946ef,#9333ea);
color:white;
font-size:18px;
font-weight:600;
transition:.3s;
}

.search-box button:hover{
transform:scale(1.03);
background:linear-gradient(135deg,#ec4899,#7e22ce);
}

.features{
display:flex;
justify-content:center;
gap:15px;
margin-top:30px;
flex-wrap:wrap;
}

.feature{
padding:10px 18px;
border-radius:30px;
background:rgba(255,255,255,.08);
border:1px solid rgba(255,255,255,.10);
color:white;
font-size:14px;
}

.footer{
margin-top:30px;
color:#ddd;
font-size:14px;
line-height:1.7;
}

.footer b{
color:#ff7bf9;
}

@media(max-width:700px){

.logo{
font-size:42px;
}

.search-box{
flex-direction:column;
border-radius:20px;
}

.search-box input{
width:100%;
}

.search-box button{
width:100%;
padding:18px;
}

}
</style>

</head>
<body>

<div class="container">

<div class="logo">
1FLIX <span>Search</span>
</div>

<div class="tagline">
🎬 Search Movies • TV Shows • Anime • Web Series
</div>

<form id="searchForm">

<div class="search-box">

<input
type="text"
id="movie"
placeholder="Search anything..."
required>

<button type="submit">
🔍 Search
</button>

</div>

</form>

<div class="features">

<div class="feature">🔥 Trending</div>
<div class="feature">🎬 Movies</div>
<div class="feature">📺 TV Shows</div>
<div class="feature">🍿 Web Series</div>
<div class="feature">⭐ HD Quality</div>

</div>

<div class="footer">
Made with ❤️ by <b>Akash</b><br>
Instagram: <b>xiakashix</b>
</div>

</div>

<script>

document.getElementById("searchForm").addEventListener("submit",function(e){

e.preventDefault();

const movie=document.getElementById("movie").value.trim();

if(movie==="") return;

// Redirect to MoviesDrive search
window.location.href="https://new1.moviesdrive.christmas/search.html?q="+encodeURIComponent(movie);

});

</script>

</body>
</html>
