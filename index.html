<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>1Flix kuchh bhi dekho</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    background:linear-gradient(135deg,#0f172a,#111827,#1e293b);
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
}

.container{
    text-align:center;
}

.logo{
    font-size:55px;
    color:white;
    font-weight:bold;
    margin-bottom:35px;
    letter-spacing:2px;
}

.logo span{
    color:#ff3b3b;
}

.search-box{
    display:flex;
    width:700px;
    max-width:90vw;
    background:rgba(255,255,255,.12);
    backdrop-filter:blur(18px);
    border:1px solid rgba(255,255,255,.2);
    border-radius:60px;
    overflow:hidden;
    box-shadow:0 20px 40px rgba(0,0,0,.35);
}

.search-box input{
    flex:1;
    padding:20px;
    font-size:18px;
    border:none;
    outline:none;
    background:transparent;
    color:white;
}

.search-box input::placeholder{
    color:#ddd;
}

.search-box button{
    width:150px;
    border:none;
    background:#ff3b3b;
    color:white;
    font-size:18px;
    cursor:pointer;
    transition:.3s;
}

.search-box button:hover{
    background:#ff2020;
}

.footer{
    color:#bbb;
    margin-top:25px;
    font-size:14px;
}
</style>

</head>
<body>

<div class="container">

<div class="logo">
Movie<span>Search</span>
</div>

<form id="searchForm">
<div class="search-box">
<input
type="text"
id="movie"
placeholder="Search Movies, Series or Anime..."
required
>

<button type="submit">
Search
</button>

</div>
</form>

<div class="footer">
MERA NAME AKASH HAI PAID PROMOTION KE LIYE INSTAGRAM PAR DM KARE INSTAGRAM ID - xiakashix
</div>

</div>

<script>

document.getElementById("searchForm").addEventListener("submit",function(e){

e.preventDefault();

let movie=document.getElementById("movie").value.trim();

if(movie!==""){

window.location.href="https://1flix.com/search/"+encodeURIComponent(movie);

}

});

</script>

</body>
</html>
